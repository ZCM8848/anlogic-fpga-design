name: Verilog Lint

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  guard:
    name: 大文件守卫
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: 检查是否有 >5MB 的文件被提交
        run: |
          big=$(find . -type f -not -path './.git/*' -size +5M)
          if [ -n "$big" ]; then
            echo "::error::以下文件超过 5MB，请勿提交大文件/安装包/视频："
            echo "$big"
            exit 1
          fi
          echo "OK: 无超大文件"

  lint-work:
    name: 检查 work/ 源码
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: 安装 iverilog
        run: sudo apt-get update && sudo apt-get install -y iverilog
      - name: 语法检查 work/rtl/（全量编译，跳过 ip/）
        run: |
          shopt -s globstar nullglob
          files=()
          for f in work/**/*.v work/**/*.sv work/**/*.vh; do
            case "$f" in
              *.enc.v|*.enc.sv) continue;;
              */ip/*) continue;;
              */retired/*) continue;;
            esac
            files+=("$f")
          done
          if [ ${#files[@]} -eq 0 ]; then
            echo "无源文件需要检查"
            exit 0
          fi
          echo "待检查文件 (${#files[@]} 个)："
          printf '  %s\n' "${files[@]}"
          # 一次性编译所有 RTL 文件，跨文件模块引用自然解析
          output=$(iverilog -g2012 -tnull -o /dev/null "${files[@]}" 2>&1 || true)
          # 过滤 "Unknown module type"（厂商 IP/原语引用，iverilog 无 Anlogic 原语库，非语法错误）
          real_errors=$(echo "$output" | grep "error:" | grep -v "Unknown module type" || true)
          if [ -n "$real_errors" ]; then
            echo "::error::Verilog 语法检查未通过"
            echo "$real_errors"
            exit 1
          fi
          echo "OK: 语法检查通过"
          # 显示被过滤的跨文件/IP 引用（仅供参考）
          skipped=$(echo "$output" | grep "Unknown module type" || true)
          if [ -n "$skipped" ]; then
            echo "::notice::以下厂商 IP/原语引用已被忽略（非语法错误）："
            echo "$skipped"
          fi

  lint-ref:
    name: 检查 ref/ 源码（仅供参考，不阻塞）
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4
      - name: 安装 iverilog
        run: sudo apt-get update && sudo apt-get install -y iverilog
      - name: 语法检查 ref/
        run: |
          shopt -s globstar nullglob
          for f in ref/**/*.v ref/**/*.sv ref/**/*.vh; do
            case "$f" in *.enc.v) continue;; esac
            iverilog -g2012 -tnull -o /dev/null "$f" || echo "warn: $f"
          done
          echo "ref/ 检查完成（不阻塞）"
