name: Verilog Lint

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  guard:
    name: 大文件守卫
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: 检查是否有 >5MB 的文件被提交
        run: |
          big=$(find . -type f -not -path './.git/*' -size +5M)
          if [ -n "$big" ]; then
            echo "::error::以下文件超过 5MB，请勿提交大文件/安装包/视频："
            echo "$big"
            exit 1
          fi
          echo "OK: 无超大文件"

  lint-work:
    name: 检查 work/ 源码
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: 安装 iverilog
        run: sudo apt-get update && sudo apt-get install -y iverilog
      - name: 语法检查 work/（按工程分组，跳过 ip/retired/enc）
        run: |
          shopt -s globstar nullglob
          set +e
          fail=0
          for project in work/*/; do
            files=()
            for f in "${project}"**/*.v "${project}"**/*.sv "${project}"**/*.vh; do
              case "$f" in
                *.enc.v|*.enc.sv) continue;;
                */ip/*) continue;;
                */retired/*) continue;;
              esac
              files+=("$f")
            done
            if [ ${#files[@]} -eq 0 ]; then
              echo "[$project] 无源文件，跳过"
              continue
            fi
            echo "[$project] 检查 ${#files[@]} 个文件"
            output=$(iverilog -g2012 -tnull -o /dev/null "${files[@]}" 2>&1)
            real_errors=$(echo "$output" | grep "error:" | grep -v "Unknown module type" || true)
            if [ -n "$real_errors" ]; then
              echo "::error::[$project] 语法检查未通过"
              echo "$real_errors"
              fail=1
            else
              echo "[$project] OK"
              skipped=$(echo "$output" | grep "Unknown module type" || true)
              if [ -n "$skipped" ]; then
                echo "::notice::[$project] 忽略厂商 IP/原语引用："
                echo "$skipped"
              fi
            fi
          done
          exit $fail

  lint-ref:
    name: 检查 ref/ 源码（仅供参考，不阻塞）
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4
      - name: 安装 iverilog
        run: sudo apt-get update && sudo apt-get install -y iverilog
      - name: 语法检查 ref/
        run: |
          shopt -s globstar nullglob
          for f in ref/**/*.v ref/**/*.sv ref/**/*.vh; do
            case "$f" in *.enc.v) continue;; esac
            iverilog -g2012 -tnull -o /dev/null "$f" || echo "warn: $f"
          done
          echo "ref/ 检查完成（不阻塞）"
